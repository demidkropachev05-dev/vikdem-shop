<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIKDEM — Магазин часов</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b0b;
    color: #fff;
}

header {
    padding: 25px 20px;
    text-align: center;
    background: linear-gradient(135deg,#050505,#1b1b1b);
    border-bottom: 1px solid #b89445;
}

.logo {
    font-size: 30px;
    font-weight: bold;
    color: #d4af37;
    letter-spacing: 4px;
}

.slogan {
    margin-top: 8px;
    color: #ccc;
    font-size: 13px;
}

.container {
    padding: 20px;
    max-width: 600px;
    margin: auto;
}

.products {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 15px;
}

.product {
    background: #151515;
    border: 1px solid #333;
    border-radius: 14px;
    padding: 12px;
    text-align: center;
}

.product-image {
    height: 170px;
    background: #222;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    margin-bottom: 10px;
}

.product h3 {
    margin: 8px 0;
    font-size: 16px;
}

.price {
    color: #d4af37;
    font-size: 20px;
    font-weight: bold;
    margin: 8px 0;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 15px;
    cursor: pointer;
    font-weight: bold;
}

.buy {
    width: 100%;
    background: linear-gradient(135deg,#d4af37,#a67c00);
    color: #000;
}

.cart-button {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #d4af37;
    color: #000;
    border-radius: 50px;
    padding: 15px 20px;
    z-index: 10;
}

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.8);
    z-index: 20;
    padding: 20px;
    overflow-y: auto;
}

.modal {
    max-width: 500px;
    margin: 40px auto;
    background: #151515;
    border: 1px solid #d4af37;
    border-radius: 15px;
    padding: 20px;
}

.modal h2 {
    color: #d4af37;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid #333;
}

input, textarea {
    width: 100%;
    margin: 8px 0;
    padding: 13px;
    background: #222;
    border: 1px solid #444;
    color: white;
    border-radius: 8px;
}

textarea {
    min-height: 80px;
}

.total {
    font-size: 22px;
    color: #d4af37;
    font-weight: bold;
    margin: 20px 0;
}

.close {
    background: #333;
    color: white;
    width: 100%;
    margin-top: 10px;
}

.success {
    text-align: center;
    padding: 30px 10px;
}

.success h2 {
    color: #d4af37;
}
</style>
</head>

<body>

<header>
    <div class="logo">VIKDEM</div>
    <div class="slogan">ВЫГЛЯДЯТ ДОРОЖЕ, ЧЕМ СТОЯТ</div>
</header>

<div class="container">

    <div class="products">

        <div class="product">
            <div class="product-image">ЧАСЫ</div>
            <h3>Модель №1</h3>
            <div class="price">2500 ₽</div>
            <button class="buy" onclick="addToCart('Модель №1',2500)">
                В корзину
            </button>
        </div>

        <div class="product">
            <div class="product-image">ЧАСЫ</div>
            <h3>Модель №2</h3>
            <div class="price">2500 ₽</div>
            <button class="buy" onclick="addToCart('Модель №2',2500)">
                В корзину
            </button>
        </div>

        <div class="product">
            <div class="product-image">ЧАСЫ</div>
            <h3>Модель №3</h3>
            <div class="price">2500 ₽</div>
            <button class="buy" onclick="addToCart('Модель №3',2500)">
                В корзину
            </button>
        </div>

        <div class="product">
            <div class="product-image">ЧАСЫ</div>
            <h3>Модель №4</h3>
            <div class="price">2500 ₽</div>
            <button class="buy" onclick="addToCart('Модель №4',2500)">
                В корзину
            </button>
        </div>

    </div>
</div>

<button class="cart-button" onclick="openCart()">
    🛒 Корзина <span id="cartCount">0</span>
</button>

<!-- КОРЗИНА -->
<div class="overlay" id="cartOverlay">
    <div class="modal">
        <h2>🛒 Корзина</h2>

        <div id="cartItems"></div>

        <div class="total">
            Итого: <span id="cartTotal">0</span> ₽
        </div>

        <button class="buy" onclick="openCheckout()">
            Оформить заказ
        </button>

        <button class="close" onclick="closeCart()">
            Закрыть
        </button>
    </div>
</div>

<!-- ОФОРМЛЕНИЕ -->
<div class="overlay" id="checkoutOverlay">
    <div class="modal">
        <h2>📦 Оформление заказа</h2>

        <input id="customerName" placeholder="Ваше имя">

        <input id="customerPhone" placeholder="Телефон">

        <input id="customerAddress" placeholder="Адрес доставки">

        <textarea id="customerComment"
                  placeholder="Комментарий к заказу"></textarea>

        <div id="orderPreview"></div>

        <button class="buy" onclick="submitOrder()">
            🚀 Оформить заказ
        </button>

        <button class="close" onclick="closeCheckout()">
            Назад
        </button>
    </div>
</div>

<!-- УСПЕШНЫЙ ЗАКАЗ -->
<div class="overlay" id="successOverlay">
    <div class="modal success">
        <h2>✅ Заказ оформлен!</h2>

        <p>
            Спасибо за заказ в VIKDEM.
        </p>

        <p>
            Мы свяжемся с вами для подтверждения.
        </p>

        <button class="buy" onclick="closeSuccess()">
            Вернуться в магазин
        </button>
    </div>
</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

let cart = JSON.parse(
    localStorage.getItem('vikdem_cart') || '[]'
);

function saveCart() {
    localStorage.setItem(
        'vikdem_cart',
        JSON.stringify(cart)
    );
}

function addToCart(name, price) {

    const existing = cart.find(
        item => item.name === name
    );

    if (existing) {
        existing.qty++;
    } else {
        cart.push({
            name: name,
            price: price,
            qty: 1
        });
    }

    saveCart();
    updateCart();

    tg.HapticFeedback.impactOccurred('light');
}

function updateCart() {

    const count = cart.reduce(
        (sum,item) => sum + item.qty,
        0
    );

    document.getElementById('cartCount').textContent = count;

    const container =
        document.getElementById('cartItems');

    if (!cart.length) {

        container.innerHTML =
            '<p>Корзина пуста.</p>';

        document.getElementById('cartTotal')
            .textContent = '0';

        return;
    }

    let total = 0;

    container.innerHTML = cart.map((item,index) => {

        const itemTotal =
            item.price * item.qty;

        total += itemTotal;

        return `
        <div class="cart-item">

            <div>
                <b>${item.name}</b><br>
                ${item.price} ₽ × ${item.qty}
            </div>

            <div>
                <button
                    onclick="changeQty(${index},-1)">
                    −
                </button>

                <button
                    onclick="changeQty(${index},1)">
                    +
                </button>
            </div>

        </div>
        `;

    }).join('');

    document.getElementById('cartTotal')
        .textContent = total;
}

function changeQty(index,value) {

    cart[index].qty += value;

    if (cart[index].qty <= 0) {
        cart.splice(index,1);
    }

    saveCart();
    updateCart();
}

function openCart() {

    updateCart();

    document.getElementById('cartOverlay')
        .style.display = 'block';
}

function closeCart() {

    document.getElementById('cartOverlay')
        .style.display = 'none';
}

function openCheckout() {

    if (!cart.length) {
        alert('Корзина пуста');
        return;
    }

    closeCart();

    buildOrderPreview();

    document.getElementById('checkoutOverlay')
        .style.display = 'block';
}

function closeCheckout() {

    document.getElementById('checkoutOverlay')
        .style.display = 'none';
}

function buildOrderPreview() {

    let total = 0;

    const html = cart.map(item => {

        const sum =
            item.price * item.qty;

        total += sum;

        return `
            <p>
                ${item.name} —
                ${item.qty} шт. —
                ${sum} ₽
            </p>
        `;

    }).join('');

    document.getElementById('orderPreview')
        .innerHTML =
        html +
        `<strong>Итого: ${total} ₽</strong>`;
}

function submitOrder() {

    const name =
        document.getElementById('customerName')
        .value.trim();

    const phone =
        document.getElementById('customerPhone')
        .value.trim();

    const address =
        document.getElementById('customerAddress')
        .value.trim();

    const comment =
        document.getElementById('customerComment')
        .value.trim();

    if (!name || !phone || !address) {

        alert(
            'Заполните имя, телефон и адрес доставки.'
        );

        return;
    }

    let total = cart.reduce(
        (sum,item) =>
            sum + item.price * item.qty,
        0
    );

    const order = {

        shop: 'VIKDEM',

        name: name,

        phone: phone,

        address: address,

        comment: comment,

        items: cart,

        total: total,

        createdAt:
            new Date().toISOString()
    };

    /*
       СОХРАНЯЕМ ЗАКАЗ ЛОКАЛЬНО
    */

    localStorage.setItem(
        'vikdem_last_order',
        JSON.stringify(order)
    );

    /*
       ОТПРАВЛЯЕМ ЗАКАЗ В TELEGRAM
    */

    if (
        window.Telegram &&
        Telegram.WebApp &&
        Telegram.WebApp.sendData
    ) {

        Telegram.WebApp.sendData(
            JSON.stringify(order)
        );

    }

    cart = [];

    saveCart();

    updateCart();

    closeCheckout();

    document.getElementById('successOverlay')
        .style.display = 'block';

    tg.HapticFeedback.notificationOccurred(
        'success'
    );
}

function closeSuccess() {

    document.getElementById('successOverlay')
        .style.display = 'none';
}

updateCart();

</script>

</body>
</html>
